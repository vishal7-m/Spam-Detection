<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Spam Detection</title>
<style>
  :root{
    --bg:#0b0b0d;
    --panel:#141416;
    --border:#242427;
    --red:#ff1744;
    --red-dim:#7a0d20;
    --text:#e8e8ea;
    --muted:#8a8a90;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Courier New',monospace;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:60px 20px;
  }
  h1{
    color:var(--red);
    font-size:clamp(28px,5vw,48px);
    letter-spacing:6px;
    text-align:center;
    text-shadow:0 0 20px rgba(255,23,68,0.35);
    margin-bottom:8px;
  }
  .subtitle{
    color:var(--muted);
    font-size:13px;
    letter-spacing:2px;
    text-transform:uppercase;
    margin-bottom:48px;
  }
  .card{
    width:100%;
    max-width:600px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:4px;
    padding:32px;
    box-shadow:0 0 0 1px rgba(255,23,68,0.05), 0 20px 60px rgba(0,0,0,0.5);
  }
  label{
    display:block;
    font-size:11px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:10px;
  }
  textarea{
    width:100%;
    min-height:150px;
    background:#0d0d0f;
    border:1px solid var(--border);
    border-radius:2px;
    color:var(--text);
    font-family:inherit;
    font-size:14px;
    padding:14px;
    resize:vertical;
    outline:none;
    transition:border-color .2s;
  }
  textarea:focus{border-color:var(--red);}
  textarea::placeholder{color:#555;}

  button{
    margin-top:18px;
    width:100%;
    padding:14px;
    background:var(--red);
    color:#0b0b0d;
    border:none;
    border-radius:2px;
    font-family:inherit;
    font-weight:bold;
    font-size:14px;
    letter-spacing:3px;
    text-transform:uppercase;
    cursor:pointer;
    transition:filter .15s, transform .05s;
  }
  button:hover{filter:brightness(1.15);}
  button:active{transform:scale(0.98);}
  button:disabled{opacity:0.5;cursor:not-allowed;}

  .result{
    margin-top:26px;
    padding:20px;
    border-radius:3px;
    text-align:center;
    font-size:20px;
    font-weight:bold;
    letter-spacing:4px;
    display:none;
    border:1px solid var(--border);
  }
  .result.show{display:block;}
  .result.spam{
    color:var(--red);
    border-color:var(--red);
    background:rgba(255,23,68,0.08);
    box-shadow:0 0 20px rgba(255,23,68,0.15) inset;
  }
  .result.ham{
    color:#3ddc84;
    border-color:#1f6b45;
    background:rgba(61,220,132,0.06);
  }
  .result .tag{display:block;font-size:24px;margin-bottom:4px;}
  .result .conf{
    display:block;
    font-size:11px;
    letter-spacing:2px;
    font-weight:normal;
    color:var(--muted);
    margin-top:6px;
  }
  footer{
    margin-top:28px;
    font-size:11px;
    color:#4a4a4e;
    letter-spacing:1px;
  }
</style>
</head>
<body>

  <h1>SPAM DETECTION</h1>
  <div class="subtitle">Naive Bayes / TF-IDF Message Classifier</div>

  <div class="card">
    <label for="msgInput">Enter Message</label>
    <textarea id="msgInput" placeholder="Type or paste an SMS/email message here..."></textarea>
    <button id="checkBtn">Check Message</button>

    <div id="result" class="result">
      <span class="tag" id="resultTag"></span>
      <span class="conf" id="resultConf"></span>
    </div>
  </div>

  <footer>Connect to /predict backend endpoint for live model inference</footer>

<script>
const btn = document.getElementById('checkBtn');
const input = document.getElementById('msgInput');
const result = document.getElementById('result');
const tag = document.getElementById('resultTag');
const conf = document.getElementById('resultConf');

// Placeholder client-side check (swap with fetch() call to your Flask/FastAPI
// backend serving the trained CountVectorizer + model from the notebook).
async function checkMessage(message){
  // Example real integration:
  // const res = await fetch('/predict', {
  //   method:'POST',
  //   headers:{'Content-Type':'application/json'},
  //   body: JSON.stringify({ message })
  // });
  // const data = await res.json();
  // return data; // { label: "Spam"|"Ham", confidence: 0.0-1.0 }

  const spamWords = ['free','win','won','winner','urgent','claim','prize','click',
    'offer','cash','credit','loan','congratulations','act now','limited',
    'guaranteed','subscribe','txt','call now','verify','account suspended'];
  const text = message.toLowerCase();
  let score = 0;
  spamWords.forEach(w => { if(text.includes(w)) score++; });
  const isSpam = score > 0;
  const confidence = Math.min(0.55 + score * 0.12, 0.97);
  return { label: isSpam ? 'Spam' : 'Ham', confidence };
}

btn.addEventListener('click', async () => {
  const msg = input.value.trim();
  if(!msg){
    input.focus();
    return;
  }
  btn.disabled = true;
  btn.textContent = 'Analyzing...';

  const { label, confidence } = await checkMessage(msg);

  result.classList.remove('spam','ham','show');
  void result.offsetWidth; // restart animation
  result.classList.add(label === 'Spam' ? 'spam' : 'ham', 'show');
  tag.textContent = label === 'Spam' ? '⚠ SPAM' : '✓ NOT SPAM';
  conf.textContent = `CONFIDENCE: ${(confidence*100).toFixed(1)}%`;

  btn.disabled = false;
  btn.textContent = 'Check Message';
});

input.addEventListener('keydown', (e) => {
  if(e.key === 'Enter' && e.ctrlKey) btn.click();
});
</script>
</body>
</html>
